name: Trigger Daily SLA Check

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  trigger-sla-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call SLA check endpoint
        run: |
          curl -H "x-cron-key: ${{ secrets.CRON_SECRET }}" "https://determined-appreciation-production-528e.up.railway.app/api/cron/sla-check"

        